# The implementer task. Starts when the owner adds `ready-for-agent` to a ticket. Builds the ticket on
# `agent/issue-<n>` and opens a draft PR, which starts the checks and the automated review.
#
# Claude never holds a GitHub token: it reads the ticket from a file and leaves its outcome in files,
# and this workflow's own steps do every GitHub write. So a run can't merge, push to `master`, or add a
# trigger label, and a prompt injected into a ticket can at worst shape a diff that a human reviews.
#
# The factory's GitHub token is the owner's, so the sender check can't tell the owner from the factory.
# What keeps runs from triggering themselves is that no run ever adds `ready-for-agent`.

name: implement

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
      OWNER: ${{ github.repository_owner }}
      OWNER_ID: ${{ github.repository_owner_id }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Claim the ticket, unless a PR is open or a blocker isn't closed
        id: claim
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          gh issue edit "$ISSUE" --remove-label ready-for-agent --add-label agent-working
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh issue comment "$ISSUE" --body "Not starting: PR #$open_pr is already open for this ticket."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          blockers=$(gh api "repos/$GH_REPO/issues/$ISSUE/dependencies/blocked_by" \
            --jq '[.[] | select(.state == "open") | "#\(.number)"] | join(", ")')
          if [ -n "$blockers" ]; then
            gh issue comment "$ISSUE" --body "Not starting: blocked by $blockers. Add \`ready-for-agent\` again once they are closed."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.claim.outputs.go == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.claim.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.claim.outputs.go == 'true'
        run: npm ci

      - if: steps.claim.outputs.go == 'true'
        uses: ./.github/actions/setup-claude

      - name: Prepare the branch, the eval key and the ticket
        if: steps.claim.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git switch --create "$BRANCH"
          git config user.name "$OWNER (factory)"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          # The app's CLI loads .envrc (gitignored) for live evals. The key stays out of the
          # environment, where Claude Code would pick it up instead of the OAuth token.
          printf 'export ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .envrc
          mkdir -p "$RUNNER_TEMP/factory/out"
          bash .github/factory/ticket.sh "$ISSUE" > "$RUNNER_TEMP/factory/ticket.md"

      - name: Build the ticket
        if: steps.claim.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TICKET_FILE: ${{ runner.temp }}/factory/ticket.md
          OUT_DIR: ${{ runner.temp }}/factory/out
        run: |
          prompt=$(envsubst '$ISSUE $BRANCH $TICKET_FILE $OUT_DIR' < .github/factory/implement.md)
          claude -p "$prompt" \
            --model claude-opus-5-5 \
            --settings .github/factory/implement-settings.json \
            --add-dir "$RUNNER_TEMP/factory" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/factory/transcript.jsonl"
          jq -r 'select(.type == "result") | .result' "$RUNNER_TEMP/factory/transcript.jsonl"

      - name: Open the draft PR, or hand the ticket back
        if: steps.claim.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/factory/out"
          if [ -f "$out/blocked.md" ]; then
            gh issue comment "$ISSUE" --body-file "$out/blocked.md"
            gh issue edit "$ISSUE" --add-label ready-for-human
            exit 0
          fi
          if [ ! -f "$out/pr-title.txt" ] || [ ! -f "$out/pr-body.md" ]; then
            echo "::error::The run wrote neither a PR title and body nor blocked.md."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The run left changes uncommitted:"
            git status --short
            exit 1
          fi
          if [ "$(git rev-list --count origin/master..HEAD)" = 0 ]; then
            echo "::error::The run made no commits."
            exit 1
          fi
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$BRANCH"
          printf '\n\nCloses #%s\n' "$ISSUE" >> "$out/pr-body.md"
          gh pr create --draft --base master --head "$BRANCH" \
            --title "$(head -n 1 "$out/pr-title.txt")" --body-file "$out/pr-body.md"

      - name: Hand the ticket back after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE" --body "The implementer run failed: $RUN_URL. Its transcript is attached to the run. Add \`ready-for-agent\` again to retry."
          gh issue edit "$ISSUE" --add-label ready-for-human

      - name: Release the ticket
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: gh issue edit "$ISSUE" --remove-label agent-working

      - name: Upload the transcript
        if: always() && steps.claim.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transcript-issue-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/factory/transcript.jsonl
          if-no-files-found: ignore
