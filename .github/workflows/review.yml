# The automated review task. Starts when a PR opens, or when the owner adds `agent-review` to ask for a
# fresh review. Reads the diff cold with the code-review skill, posts one comment-only review, and labels
# the PR `review-passed` or `review-failed`. A pass also marks a draft PR ready for human review.
#
# It triggers nothing next: a human merges, or pushes fixes and adds `agent-review` again. Pushes to
# the PR don't start a review, and neither does marking it ready, so a pass can't start a second one.
# PRs from forks are skipped. Like the implementer, Claude holds no GitHub token.

name: review

on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       (github.event.label.name == 'agent-review' && github.event.sender.login == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Take the review label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: gh pr edit "$PR" --remove-label agent-review

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-claude

      - name: Gather the tickets the PR closes
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/factory/out"
          tickets="$RUNNER_TEMP/factory/tickets.md"
          issues=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          if [ -z "$issues" ]; then
            echo "This PR closes no ticket, so there is no spec: skip the Spec axis." > "$tickets"
          else
            for issue in $issues; do
              bash .github/factory/ticket.sh "$issue" >> "$tickets"
              printf '\n\n' >> "$tickets"
            done
          fi

      - name: Review the PR
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TICKET_FILE: ${{ runner.temp }}/factory/tickets.md
          OUT_DIR: ${{ runner.temp }}/factory/out
        run: |
          prompt=$(envsubst '$PR $TICKET_FILE $OUT_DIR' < .github/factory/review.md)
          claude -p "$prompt" \
            --model claude-opus-5-5 \
            --settings .github/factory/review-settings.json \
            --add-dir "$RUNNER_TEMP/factory" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/factory/transcript.jsonl"
          jq -r 'select(.type == "result") | .result' "$RUNNER_TEMP/factory/transcript.jsonl"

      - name: Post the review and its verdict
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/factory/out"
          verdict=$(tr -d '[:space:]' < "$out/verdict.txt")
          if [ "$verdict" != pass ] && [ "$verdict" != fail ]; then
            echo "::error::verdict.txt says '$verdict', not pass or fail."
            exit 1
          fi
          gh pr review "$PR" --comment --body-file "$out/review.md"
          gh pr edit "$PR" --remove-label review-passed --remove-label review-failed
          if [ "$verdict" = pass ]; then
            gh pr edit "$PR" --add-label review-passed
            if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = true ]; then
              gh pr ready "$PR"
            fi
          else
            gh pr edit "$PR" --add-label review-failed
          fi

      - name: Report a failed review run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --body "The automated review run failed: $RUN_URL. Add \`agent-review\` to retry."

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/factory/transcript.jsonl
          if-no-files-found: ignore
