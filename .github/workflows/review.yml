# The automated review task. Starts when a PR opens, or when the owner adds `agent-review` to ask for a
# fresh review. The review itself is `review-pr.yml`, a reusable workflow that `fix.yml` calls too:
# it reads the diff cold with the code-review skill, posts one comment-only review, and labels the
# PR `review-passed` or `review-failed`. A pass also marks a draft PR ready for human review.
#
# What it triggers next: a failed review of an agent PR (`agent/issue-*`) starts a fix run
# (`fix.yml`, on `workflow_run`), unless the PR has had its one fix attempt. Otherwise nothing: a
# human merges, or pushes fixes and adds `agent-review` again. Pushes to the PR don't start a
# review, and neither does marking it ready, so a pass can't start a second one. PRs from forks are
# skipped.
#
# A `pull_request` run takes this file and `review-pr.yml` from the PR branch; the review's
# prompts, permissions and scripts still come from master.

name: review

on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       (github.event.label.name == 'agent-review' && github.event.sender.login == github.repository_owner))
    uses: ./.github/workflows/review-pr.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      pr: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      take-review-label: ${{ github.event.action == 'labeled' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
